name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@10.9.9
      - name: npm ci
        id: npmci
        run: npm ci || (echo "::warning::npm ci recusou o lockfile (quirk de deps wasm32/opcionais); seguindo com npm install" && npm install)
      - name: Diagnóstico do npm ci
        if: failure() && steps.npmci.outcome == 'failure'
        run: |
          echo "::error::npm $(npm -v) / node $(node -v)"
          LOG=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            grep -E 'error' "$LOG" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::error::nenhum log do npm encontrado"
          fi
      - run: npm test
      - run: npm run typecheck
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
